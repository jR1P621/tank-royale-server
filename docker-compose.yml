      SERVER_URL: ws://tank-royale-server:7654
      SERVER_SECRET: j1etPtYUMVuCWGUlW6hF6AV
    depends_on:
      - tank-royale-server
      - battle-controller
    restart: unless-stopped
  battle-controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    container_name: battle-controller
    environment:
      SERVER_URL: ws://tank-royale-server:7654
      CONTROLLER_SECRET: 7Tr04oRlwlnC84ksjhhzESQ
      MIN_BOTS: 30
      MAX_BOTS: 30
      NUM_ROUNDS: 2
      EXPECTED_NEURAL_BOTS: 20
      REQUIRED_NON_NEURAL_BOTS: 10
      NEURAL_HOST_PREFIX: neural-bot-
      POST_BATTLE_COOL_DOWN: 10
      PRE_START_QUIET_PERIOD: 1.5
    depends_on:
      - tank-royale-server
    restart: unless-stopped
  neural-bot-021:
